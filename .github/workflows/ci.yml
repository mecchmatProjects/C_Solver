name: C17 baseline

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure baseline (InvSqrt and Arctan tests pending)
        run: cmake -S . -B build -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Debug
      - name: Test baseline only
        run: ctest --test-dir build -C Debug --output-on-failure
